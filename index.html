<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FruitMart</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Status Bar -->
    <div class="status-bar">
        <span>08:27</span>

        <div class="status-icons">

            <!-- Wi-Fi -->
            <svg class="status-icon" viewBox="0 0 24 24">
                <path d="M3 8.5C8 4.5 16 4.5 21 8.5"></path>
                <path d="M6 12C9.5 9.5 14.5 9.5 18 12"></path>
                <path d="M9.5 15.5C11 14.5 13 14.5 14.5 15.5"></path>
                <circle cx="12" cy="19" r="1"></circle>
            </svg>

            <!-- Battery -->
            <svg class="status-icon battery" viewBox="0 0 24 24">
                <rect x="3" y="7" width="17" height="10" rx="2"></rect>
                <path d="M21 10v4"></path>
            </svg>

        </div>
    </div>

    <!-- Search -->
    <div class="search-bar">

        <svg class="search-icon" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M16 16l5 5"></path>
        </svg>

        <input type="text" placeholder="Search">

        <svg class="camera-icon" viewBox="0 0 24 24">
            <rect x="3" y="6" width="18" height="14" rx="2"></rect>
            <circle cx="12" cy="13" r="3"></circle>
            <path d="M8 6l1.5-2h5L16 6"></path>
        </svg>

    </div>

    <!-- Menu -->
    <div class="menu">
        <button>♡ Favorites</button>
        <button>↶ History</button>
        <button>♙ Following</button>
    </div>

    <!-- Banner -->
    <section class="banner">
        <img src="images/banner.png" alt="Fruit Summer Sale">
    </section>

    <!-- Categories -->
    <section class="categories">

        <div class="section-title">
            <h2>Buah</h2>
            <button>></button>
        </div>

        <div class="category-list">

            <div class="category" data-category="All">
                <div class="all-category">All</div>
                <p>Semua</p>
            </div>

            <div class="category" data-category="Mango">
                <img src="images/mango.png" alt="Mango">
                <p>Mango</p>
            </div>

            <div class="category" data-category="Banana">
                <img src="images/banana.png" alt="Banana">
                <p>Banana</p>
            </div>

            <div class="category" data-category="Apple">
                <img src="images/apple.png" alt="Apple">
                <p>Apple</p>
            </div>

            <div class="category" data-category="Grapes">
                <img src="images/grapes.png" alt="Grapes">
                <p>Grapes</p>
            </div>

            <div class="category" data-category="Watermelon">
                <img src="images/watermelon.png" alt="Watermelon">
                <p>Watermelon</p>
            </div>

        </div>

    </section>

    <!-- Products -->
    <section class="products">

        <div class="section-title">
            <h2>Produk</h2>
            <button>></button>
        </div>

        <div class="product-list">

            <p class="no-product" id="noProduct">
                Produk tidak ditemukan
            </p>

            <div class="product-card" data-category="Mango">
                <img src="images/mango-product.png" alt="Fresh Mango">

                <small>Zyy Fruit</small>

                <h3>Fresh Mango</h3>

                <div class="product-bottom">
                    <p>$4.99</p>

                    <button class="add-button">+</button>
                </div>

            </div>

            <div class="product-card" data-category="Watermelon">
                <img src="images/watermelon-product.png" alt="Watermelon Honey">

                <small>Zyy Fruit</small>

                <h3>Watermelon Honey</h3>

                <div class="product-bottom">
                    <p>$6.99</p>

                    <button class="add-button">+</button>
                </div>

            </div>
            <div class="product-card" data-category="Orange">
                <img src="images/orange.png" alt="Orange">

                <small>Zyy Fruit</small>

                <h3>Orange</h3>

                <div class="product-bottom">
                    <p>$3.99</p>
                    <button class="add-button">+</button>
                </div>
            </div>

        </div>

    </section>

    <div class="cart-panel" id="cartPanel">

        <div class="cart-header">
            <h2>Keranjang</h2>

            <button id="closeCart">×</button>
        </div>

        <div class="cart-items" id="cartItems">
            <p class="empty-cart">Keranjang masih kosong</p>
        </div>

        <button class="checkout-button" id="checkoutButton">
            Checkout
        </button>

        <div class="cart-total">
            <span>Total</span>
            <strong id="cartTotal">$0.00</strong>
        </div>

    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">

        <span class="nav-item active">
            <svg viewBox="0 0 24 24">
                <path d="M3 11.5L12 4l9 7.5"></path>
                <path d="M5 10v10h14V10"></path>
            </svg>
        </span>

        <span class="nav-item">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="8"></circle>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
        </span>

        <span class="nav-item cart-nav">
            <svg viewBox="0 0 24 24">
                <path d="M5 7h14l-1 11H6L5 7z"></path>
                <path d="M9 7a3 3 0 0 1 6 0"></path>
            </svg>

            <span class="cart-count">0</span>
        </span>

        <span class="nav-item">
            <svg viewBox="0 0 24 24">
                <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
                <path d="M10 21h4"></path>
            </svg>
        </span>

        <span class="nav-item">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4"></circle>
                <path d="M4 21c1-4 4-6 8-6s7 2 8 6"></path>
            </svg>
        </span>

    </nav>

    <script src="script.js"></script>

</body>

</html>
